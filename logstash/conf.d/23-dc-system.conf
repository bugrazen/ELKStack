##############################################################################
# SYSTEM LOG FILTER
# Purpose: Parse and enrich Windows System Events
# Channel: System
##############################################################################

filter {
  if [winlog][channel] == "System" {

    ##########################################################################
    # BASE
    # NOT: Winlogbeat bazi event'lerde [event][action] / [event][category]
    #      alanlarini kendisi doldurur ("None", "SystemSessionSwitch" vb).
    #      Bu yuzden her yerde add_field DEGIL replace kullaniliyor,
    #      yoksa alan dizi haline geliyor.
    ##########################################################################
    mutate {
      replace   => { "[event][category]" => "system" }
      add_tag   => ["dc", "system"]
      add_field => { "[log][type]" => "system" }
    }

    ##########################################################################
    # BOOT / SHUTDOWN
    ##########################################################################

    # 6005 - Event Log Service Started (boot)
    if [event][code] == "6005" {
      mutate {
        replace   => { "[event][action]" => "eventlog_service_started" }
        add_field => { "[event][risk_score]" => "30" }
        add_tag   => ["system_start", "boot_event"]
      }
    }

    # 6006 - Event Log Service Stopped (clean shutdown)
    if [event][code] == "6006" {
      mutate {
        replace   => { "[event][action]" => "eventlog_service_stopped" }
        add_field => { "[event][risk_score]" => "30" }
        add_tag   => ["system_stop", "boot_event"]
      }
    }

    # 6008 - Onceki kapanma beklenmedik sekilde gerceklesti
    if [event][code] == "6008" {
      mutate {
        replace   => { "[event][action]" => "unexpected_shutdown_detected" }
        add_field => { "[event][risk_score]" => "75" }
        add_tag   => ["unexpected_shutdown", "critical_error", "boot_event"]
      }
    }

    # 41 - Kernel-Power: sistem duzgun kapanmadi
    if [event][code] == "41" {
      mutate {
        replace   => { "[event][action]" => "kernel_power_unexpected" }
        add_field => { "[event][risk_score]" => "80" }
        add_tag   => ["unexpected_shutdown", "critical_error"]
      }
    }

    # 1074 - Kim / hangi process reboot-shutdown baslatti (FORENSIC)
    if [event][code] == "1074" {
      mutate {
        replace   => { "[event][action]" => "shutdown_initiated" }
        add_field => { "[event][risk_score]" => "60" }
        add_tag   => ["shutdown_initiated", "boot_event", "accountability"]
      }
    }

    ##########################################################################
    # LOG TAMPERING
    ##########################################################################

    # 104 - System log temizlendi (Security'deki 1102'nin muadili)
    if [event][code] == "104" {
      mutate {
        replace   => { "[event][category]" => "audit_log" }
        replace   => { "[event][action]" => "system_log_cleared" }
        add_field => { "[event][risk_score]" => "95" }
        add_tag   => ["log_cleared", "defense_evasion", "high_risk"]
      }
    }

    ##########################################################################
    # SERVICE CONTROL MANAGER
    ##########################################################################

    # 7045 - Yeni servis kuruldu  (21-dc-security.conf'tan buraya tasindi)
    if [event][code] == "7045" {
      mutate {
        replace   => { "[event][category]" => "service_management" }
        replace   => { "[event][action]" => "new_service_installed" }
        add_field => { "[event][risk_score]" => "70" }
        add_tag   => ["new_service_installed", "persistence", "high_risk"]
      }
    }

    # 7040 - Servis baslangic tipi degisti
    if [event][code] == "7040" {
      mutate {
        replace   => { "[event][category]" => "service_management" }
        replace   => { "[event][action]" => "service_starttype_changed" }
        add_field => { "[event][risk_score]" => "55" }
        add_tag   => ["service_config_changed"]
      }
    }

    # 7031 / 7034 - Servis beklenmedik sekilde durdu
    if [event][code] in ["7031", "7034"] {
      mutate {
        replace   => { "[event][category]" => "service_management" }
        replace   => { "[event][action]" => "service_crashed" }
        add_field => { "[event][risk_score]" => "50" }
        add_tag   => ["service_crash"]
      }
    }

    # 7036 - Servis basladi / durdu  (SAF GURULTU - routine)
    if [event][code] == "7036" {
      mutate {
        replace   => { "[event][category]" => "service_management" }
        replace   => { "[event][action]" => "service_state_change" }
        add_field => { "[event][risk_score]" => "10" }
        add_tag   => ["system-routine", "service_state"]
      }
    }

    ##########################################################################
    # NETLOGON / SECURE CHANNEL
    ##########################################################################

    # 5723 / 5805 - Makine hesabi secure channel dogrulamasi basarisiz
    if [event][code] in ["5723", "5805"] {
      mutate {
        replace   => { "[event][category]" => "netlogon" }
        replace   => { "[event][action]" => "secure_channel_failure" }
        add_field => { "[event][risk_score]" => "65" }
        add_tag   => ["netlogon_failure", "trust_issue"]
      }
    }

    ##########################################################################
    # DIRECTORY SERVICES SAM - Remote SAM Restriction (16962-16969)
    # Kaynak: Microsoft-Windows-Directory-Services-SAM  /  Kanal: System
    #
    # DIKKAT: Gercek event_data alan adlari sonunda ":" iceriyor:
    #   "Client SID:"  ve  "Client Network Address:"
    ##########################################################################

    if [winlog][provider_name] == "Microsoft-Windows-Directory-Services-SAM" and
       [event][code] in ["16962","16963","16964","16965","16966","16967","16968","16969"] {

      mutate {
        replace => { "[event][category]" => "sam_access" }
        add_tag => ["samrpc", "sam_restriction"]
      }

      ruby {
        code => '
          code = event.get("[event][code]").to_s
          ed   = event.get("[winlog][event_data]") || {}
          msg  = event.get("message").to_s

          meta = {
            "16962" => ["default_sd_fallback",   "SDDL registryde yok, default kullaniliyor",     30],
            "16963" => ["registry_sd_loaded",    "Registry SDDL okundu",                          20],
            "16964" => ["malformed_sd",          "Registry SDDL bozuk",                           80],
            "16965" => ["remote_call_denied",    "Uzak SAM cagrisi reddedildi",                   60],
            "16966" => ["audit_mode_enabled",    "Audit-only mode acildi",                        50],
            "16967" => ["audit_mode_disabled",   "Audit-only mode kapandi",                       70],
            "16968" => ["would_have_denied",     "Audit mode: normalde reddedilecekti",           55],
            "16969" => ["denied_throttle_count", "Throttle penceresinde reddedilen cagri sayisi", 45]
          }

          action, desc, risk = meta[code]
          event.set("[event][action]", action)
          event.set("[event][description_tr]", desc)

          tags = event.get("tags") || []

          # Alan adi varyantlarini sirayla dene
          pick = lambda do |hash, keys|
            found = nil
            keys.each do |k|
              v = hash[k]
              if !v.nil? && !v.to_s.strip.empty?
                found = v.to_s.strip
                break
              end
            end
            found
          end

          # ---------- 16965 / 16968 : client kimligi tasiyanlar ----------
          if ["16965","16968"].include?(code)
            sid  = pick.call(ed, ["Client SID:", "ClientSID", "Client SID", "param1"])
            addr = pick.call(ed, ["Client Network Address:", "ClientNetworkAddress", "Client Network Address", "param2"])

            # event_data bos gelirse mesajdan cek
            if sid.nil? && msg =~ /Client SID:\s*(S-[0-9\-]+)/
              sid = $1
            end
            if addr.nil? && msg =~ /network address:\s*([0-9a-fA-F\.:]+)/
              addr = $1
            end

            event.set("[sam][client][sid]", sid)      if sid
            event.set("[sam][client][address]", addr) if addr
            tags << "sam_client_identified" if sid || addr

            # S-1-5-7 = ANONYMOUS LOGON -> en kritik senaryo
            if sid == "S-1-5-7"
              risk = 90
              event.set("[sam][client][type]", "anonymous")
              tags << "anonymous_sam_enumeration" << "credential_access"
            elsif sid
              event.set("[sam][client][type]", "authenticated")
            end
          end

          # ---------- 16969 : bastirilmis cagri sayaci ----------
          if code == "16969"
            supp   = pick.call(ed, ["Suppressed Message Count:", "SuppressedMessageCount", "param2"])
            window = pick.call(ed, ["Throttle window:", "ThrottleWindow", "param1"])

            if supp.nil? && msg =~ /(\d+)\s+remote calls/i
              supp = $1
            end
            if window.nil? && msg =~ /past\s+(\d+)[\s\-]*seconds/i
              window = $1
            end

            if supp
              n = supp.to_i
              event.set("[sam][suppressed_count]", n)
              if n >= 50
                risk = 75
                tags << "high_sam_denial_volume"
              elsif n >= 10
                risk = 60
              end
            end
            event.set("[sam][throttle_window_sec]", window.to_i) if window
          end

          # Audit mode kapatildi -> kim kapatti sorusu
          tags << "defense_evasion" if code == "16967"

          tags << "high_risk" if risk >= 70

          event.set("[event][risk_score]", risk.to_s)
          event.set("tags", tags.uniq)
        '
      }
    }

    ##########################################################################
    # RISK NORMALIZATION & FINAL
    ##########################################################################

    # Yukarida eslesmeyen her sey routine
    if ![event][risk_score] {
      mutate {
        add_field => { "[event][risk_score]" => "15" }
        add_tag   => ["system-routine"]
      }
    }

    mutate {
      convert => { "[event][risk_score]" => "integer" }
    }

    if [event][risk_score] >= 70 {
      mutate { add_tag => ["critical_event"] }
    } else if [event][risk_score] >= 40 {
      mutate { add_tag => ["medium_event"] }
    } else {
      mutate { add_tag => ["low_event"] }
    }

  } # end if [winlog][channel] == "System"
}
