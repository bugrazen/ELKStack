##############################################################################
# SECURITY LOG FILTER
# Purpose: Parse and enrich Windows Security Events
# Channel: Security
##############################################################################

filter {
  
  # Sadece Security channel loglarını işle
  if [winlog][channel] == "Security" {
    
    # Genel security log enrichment
    mutate {
      add_field => { "[log][type]" => "security" }
    }
    
    ##########################################################################
    # ACCOUNT MANAGEMENT EVENTS
    ##########################################################################
    
    # 4720: User Account Created
    if [event][code] == "4720" {
      mutate {
        add_field => {
          "[event][category]" => "account_management"
          "[event][subcategory]" => "user_creation"
          "[event][action]" => "user_created"
        }
        add_tag => ["user_created", "account_change"]
      }
      
      # Privileged account detection
      if [winlog][event_data][TargetUserName] =~ /(?i)^(admin|adm|root|sa|svc|service)/ {
        mutate {
          add_field => { "[event][risk_score]" => "80" }
          add_tag => ["privileged_account", "high_risk"]
        }
      } else {
        mutate {
          add_field => { "[event][risk_score]" => "30" }
        }
      }
    }
    
    # 4722: User Account Enabled
    if [event][code] == "4722" {
      mutate {
        add_field => {
          "[event][category]" => "account_management"
          "[event][subcategory]" => "user_enabled"
          "[event][action]" => "user_enabled"
          "[event][risk_score]" => "50"
        }
        add_tag => ["user_enabled", "account_change"]
      }
    }
    
    # 4723: Password Change Attempt
    if [event][code] == "4723" {
      mutate {
        add_field => {
          "[event][category]" => "account_management"
          "[event][subcategory]" => "password_change"
          "[event][action]" => "password_change_attempt"
          "[event][risk_score]" => "20"
        }
        add_tag => ["password_change"]
      }
    }
    
    # 4724: Password Reset Attempt
    if [event][code] == "4724" {
      mutate {
        add_field => {
          "[event][category]" => "account_management"
          "[event][subcategory]" => "password_reset"
          "[event][action]" => "password_reset_attempt"
          "[event][risk_score]" => "40"
        }
        add_tag => ["password_reset", "account_change"]
      }
    }
    
    # 4725: User Account Disabled
    if [event][code] == "4725" {
      mutate {
        add_field => {
          "[event][category]" => "account_management"
          "[event][subcategory]" => "user_disabled"
          "[event][action]" => "user_disabled"
          "[event][risk_score]" => "60"
        }
        add_tag => ["user_disabled", "account_change", "medium_risk"]
      }
    }
    
    # 4726: User Account Deleted
    if [event][code] == "4726" {
      mutate {
        add_field => {
          "[event][category]" => "account_management"
          "[event][subcategory]" => "user_deletion"
          "[event][action]" => "user_deleted"
          "[event][risk_score]" => "70"
        }
        add_tag => ["user_deleted", "account_change", "high_risk"]
      }
    }

    # 4740: Account Locked Out (BRUTE FORCE INDICATOR!)
    if [event][code] == "4740" {
      mutate {
        add_field => {
          "[event][category]" => "account_management"
          "[event][subcategory]" => "account_lockout"
          "[event][action]" => "account_locked_out"
          "[event][risk_score]" => "85"
        }
        add_tag => ["account_locked", "brute_force_indicator", "high_risk"]
      }
    }

    # 4738: User Account Changed (PASSWORD NEVER EXPIRES!)
    if [event][code] == "4738" {
      
      mutate {
        add_field => {
          "[event][category]" => "account_management"
          "[event][subcategory]" => "user_modification"
          "[event][action]" => "user_account_modified"
        }
        add_tag => ["user_modified", "account_change"]
      }
      
      # UAC (UserAccountControl) Parsing
      ruby {
        code => '
          new_uac = event.get("[winlog][event_data][NewUacValue]")
          old_uac = event.get("[winlog][event_data][OldUacValue]")
          
          if new_uac
            # Hex to Decimal
            new_dec = new_uac.start_with?("0x") ? new_uac[2..-1].to_i(16) : new_uac.to_i
            old_dec = old_uac && old_uac.start_with?("0x") ? old_uac[2..-1].to_i(16) : old_uac.to_i
            
            # UAC Flags
            flags = {
              "account_disabled" => 2,
              "password_not_required" => 32,
              "password_cant_change" => 64,
              "encrypted_text_pwd_allowed" => 128,
              "normal_account" => 512,
              "dont_expire_password" => 65536,
              "smartcard_required" => 262144,
              "trusted_for_delegation" => 524288,
              "not_delegated" => 1048576,
              "use_des_key_only" => 2097152,
              "dont_require_preauth" => 4194304,
              "password_expired" => 8388608
            }
            
            # Parse new state
            flags.each do |name, value|
              is_set = (new_dec & value) != 0
              event.set("[user][uac][#{name}]", is_set)
              
              # Change detection
              if old_dec
                was_set = (old_dec & value) != 0
                if was_set != is_set
                  event.set("[user][uac][#{name}_changed]", true)
                  event.set("[user][uac][#{name}_action]", is_set ? "enabled" : "disabled")
                  
                  # Add specific tags
                  tags = event.get("tags") || []
                  tags << "uac_#{name}_#{is_set ? "enabled" : "disabled"}"
                  event.set("tags", tags)
                end
              end
            end
            
            # Risk scoring
            risk = 20
            risk += 60 if event.get("[user][uac][dont_expire_password]") == true && event.get("[user][uac][dont_expire_password_changed]") == true
            risk += 50 if event.get("[user][uac][account_disabled]") == false && event.get("[user][uac][account_disabled_changed]") == true
            risk += 80 if event.get("[user][uac][trusted_for_delegation]") == true && event.get("[user][uac][trusted_for_delegation_changed]") == true
            risk += 70 if event.get("[user][uac][dont_require_preauth]") == true && event.get("[user][uac][dont_require_preauth_changed]") == true
            risk += 55 if event.get("[user][uac][password_not_required]") == true && event.get("[user][uac][password_not_required_changed]") == true
            
            event.set("[event][risk_score]", risk.to_s)
            
            # High risk tag
            if risk >= 70
              tags = event.get("tags") || []
              tags << "high_risk"
              event.set("tags", tags)
            end
            
            # Debug
            event.set("[debug][uac_new_decimal]", new_dec)
            event.set("[debug][uac_old_decimal]", old_dec) if old_dec
          end
        '
      }
    }
    
    ##########################################################################
    # GROUP MANAGEMENT EVENTS
    ##########################################################################
    
    # 4727: Global Security Group Created
    if [event][code] == "4727" {
      mutate {
        add_field => {
          "[event][category]" => "group_management"
          "[event][subcategory]" => "group_creation"
          "[event][action]" => "security_group_created"
          "[event][risk_score]" => "50"
        }
        add_tag => ["group_created", "group_change"]
      }
    }

    # 4728: Member Added to Global Security Group (Domain Admins!)
    if [event][code] == "4728" {
      mutate {
        add_field => {
          "[event][category]" => "group_management"
          "[event][subcategory]" => "global_group_member_added"
          "[event][action]" => "member_added_to_global_group"
        }
        add_tag => ["member_added", "global_group_change"]
      }
  
      # Critical group detection (same logic as 4732)
      ruby {
        code => '
          target_group = event.get("[winlog][event_data][TargetUserName]") || ""
      
          critical_groups = [
            "Domain Admins",
            "Enterprise Admins", 
            "Schema Admins",
            "Administrators"
          ]
      
          is_critical = critical_groups.any? { |g| target_group.downcase.include?(g.downcase) }
      
          if is_critical
            event.set("[event][risk_score]", "95")
            tags = event.get("tags") || []
            tags << "critical_group_addition" << "privileged_escalation" << "high_risk"
            event.set("tags", tags)
          else
            event.set("[event][risk_score]", "40")
          end
        '
      }
    }

    # 4730: Global Security Group Deleted
    if [event][code] == "4730" {
      mutate {
        add_field => {
          "[event][category]" => "group_management"
          "[event][subcategory]" => "group_deletion"
          "[event][action]" => "security_group_deleted"
          "[event][risk_score]" => "70"
        }
        add_tag => ["group_deleted", "group_change", "high_risk"]
      }
    }
    
    # 4732: Member Added to Security Group
    if [event][code] == "4732" {
      mutate {
        add_field => {
          "[event][category]" => "group_management"
          "[event][subcategory]" => "member_addition"
          "[event][action]" => "member_added_to_group"
        }
        add_tag => ["member_added", "group_change"]
      }
      
      # Critical group detection
      ruby {
        code => '
          target_group = event.get("[winlog][event_data][TargetUserName]") || ""
          
          critical_groups = [
            "Domain Admins",
            "Enterprise Admins", 
            "Schema Admins",
            "Administrators",
            "Backup Operators",
            "Account Operators",
            "Server Operators",
            "Print Operators",
            "Remote Desktop Users",
            "DNSAdmins",
            "DnsAdmins"
          ]
          
          is_critical = critical_groups.any? { |g| target_group.downcase.include?(g.downcase) }
          
          if is_critical
            event.set("[event][risk_score]", "95")
            tags = event.get("tags") || []
            tags << "critical_group_addition" << "privileged_escalation" << "high_risk"
            event.set("tags", tags)
            event.set("[event][critical_group]", true)
          else
            event.set("[event][risk_score]", "40")
          end
        '
      }
    }
    
    # 4733: Member Removed from Security Group
    if [event][code] == "4733" {
      mutate {
        add_field => {
          "[event][category]" => "group_management"
          "[event][subcategory]" => "member_removal"
          "[event][action]" => "member_removed_from_group"
          "[event][risk_score]" => "50"
        }
        add_tag => ["member_removed", "group_change"]
      }
    }

    # 4756: Member Added to Universal Security Group
    if [event][code] == "4756" {
      mutate {
        add_field => {
          "[event][category]" => "group_management"
          "[event][subcategory]" => "universal_group_member_added"
          "[event][action]" => "member_added_to_universal_group"
        }
        add_tag => ["member_added", "universal_group_change"]
      }
  
      ruby {
        code => '
          target_group = event.get("[winlog][event_data][TargetUserName]") || ""
      
          critical_groups = ["Enterprise Admins", "Schema Admins"]
      
          is_critical = critical_groups.any? { |g| target_group.downcase.include?(g.downcase) }
      
          if is_critical
            event.set("[event][risk_score]", "95")
            tags = event.get("tags") || []
            tags << "critical_universal_group_addition" << "privileged_escalation" << "high_risk"
            event.set("tags", tags)
          else
            event.set("[event][risk_score]", "45")
          end
        '
      }
    }
    
    ##########################################################################
    # AUTHENTICATION EVENTS
    ##########################################################################
    
    # 4625: Failed Logon
    if [event][code] == "4625" {
      
      mutate {
        add_field => {
          "[event][category]" => "authentication"
          "[event][subcategory]" => "logon_failure"
          "[event][action]" => "failed_logon"
        }
        add_tag => ["logon_failure", "authentication", "potential_attack"]
      }
      
      # Failure Reason & Logon Type Parsing
      ruby {
        code => '
          status = event.get("[winlog][event_data][Status]")
          sub_status = event.get("[winlog][event_data][SubStatus]")
          logon_type = event.get("[winlog][event_data][LogonType]")
          
          # Failure reasons
          failure_codes = {
            "0xC0000064" => "User does not exist",
            "0xC000006A" => "Incorrect password",
            "0xC000006D" => "Bad username or password",
            "0xC000006E" => "User account restriction",
            "0xC000006F" => "Logon outside allowed time",
            "0xC0000070" => "Workstation restriction",
            "0xC0000071" => "Password expired",
            "0xC0000072" => "Account disabled",
            "0xC0000193" => "Account expired",
            "0xC0000224" => "Password must change",
            "0xC0000234" => "Account locked out"
          }
          
          if status
            reason = failure_codes[status] || "Unknown (#{status})"
            event.set("[event][failure_reason]", reason)
            event.set("[event][failure_code]", status)
            
            # Risk scoring
            risk = 30
            tags = event.get("tags") || []
            
            case status
            when "0xC0000234"  # Locked out
              risk = 60
              tags << "account_locked"
            when "0xC0000072"  # Disabled
              risk = 50
              tags << "account_disabled_access_attempt"
            when "0xC000006A", "0xC000006D"  # Wrong password
              risk = 40
              tags << "wrong_password"
            when "0xC0000064"  # User not exist
              risk = 35
              tags << "username_enumeration"
            end
            
            event.set("[event][risk_score]", risk.to_s)
            event.set("tags", tags)
          end
          
          # Logon type
          logon_types = {
            "2" => "Interactive",
            "3" => "Network",
            "10" => "RemoteInteractive"
          }
          
          if logon_type
            desc = logon_types[logon_type] || "Type_#{logon_type}"
            event.set("[event][logon_type]", logon_type)
            event.set("[event][logon_type_desc]", desc)
            
            # RDP brute force
            if logon_type == "10"
              tags = event.get("tags") || []
              tags << "rdp_failed_logon" << "potential_brute_force"
              event.set("tags", tags)
            end
          end
        '
      }
    }
    
    # 4648: Logon with Explicit Credentials (RunAs)
    if [event][code] == "4648" {
      mutate {
        add_field => {
          "[event][category]" => "authentication"
          "[event][subcategory]" => "explicit_credentials"
          "[event][action]" => "runas_logon"
          "[event][risk_score]" => "45"
        }
        add_tag => ["runas", "explicit_credentials", "authentication"]
      }
    }
    
    ##########################################################################
    # PRIVILEGE USE
    ##########################################################################
    
    # 4672: Special Privileges Assigned to Logon
    if [event][code] == "4672" {
      mutate {
        add_field => {
          "[event][category]" => "privilege_use"
          "[event][subcategory]" => "privileged_logon"
          "[event][action]" => "privileged_service_called"
        }
        add_tag => ["privileged_logon", "privilege_use"]
      }
      
      # Sensitive privilege detection
      ruby {
        code => '
          priv_list = event.get("[winlog][event_data][PrivilegeList]") || ""
          
          sensitive_privs = {
            "SeDebugPrivilege" => 90,
            "SeTcbPrivilege" => 95,
            "SeBackupPrivilege" => 70,
            "SeRestorePrivilege" => 70,
            "SeTakeOwnershipPrivilege" => 80,
            "SeLoadDriverPrivilege" => 85,
            "SeSystemEnvironmentPrivilege" => 75,
            "SeManageVolumePrivilege" => 65,
            "SeImpersonatePrivilege" => 60
          }
          
          risk = 40
          tags = event.get("tags") || []
          found_privs = []
          
          sensitive_privs.each do |priv, priv_risk|
            if priv_list.include?(priv)
              found_privs << priv
              risk = [risk, priv_risk].max
            end
          end
          
          if !found_privs.empty?
            event.set("[event][sensitive_privileges]", found_privs)
            tags << "sensitive_privilege_used" << "high_risk"
          end
          
          event.set("[event][risk_score]", risk.to_s)
          event.set("tags", tags) unless tags.empty?
        '
      }
    }
    
    # 4673: Sensitive Privilege Used
    if [event][code] == "4673" {
      mutate {
        add_field => {
          "[event][category]" => "privilege_use"
          "[event][subcategory]" => "sensitive_privilege_use"
          "[event][action]" => "sensitive_privilege_used"
          "[event][risk_score]" => "70"
        }
        add_tag => ["privilege_used", "privilege_use", "high_risk"]
      }
    }

    # 4794: DSRM Password Set (VERY CRITICAL!)
    if [event][code] == "4794" {
      mutate {
        add_field => {
          "[event][category]" => "account_management"
          "[event][subcategory]" => "dsrm_password_set"
          "[event][action]" => "dsrm_password_changed"
          "[event][risk_score]" => "90"
        }
        add_tag => ["dsrm_password_set", "persistence", "high_risk", "golden_ticket_prep"]
      }
    }

    ##########################################################################
    # ACTIVE DIRECTORY CHANGES
    ##########################################################################
    
    # 5136: Directory Service Object Modified
    if [event][code] == "5136" {
      mutate {
        add_field => {
          "[event][category]" => "directory_service_changes"
          "[event][subcategory]" => "object_modification"
          "[event][action]" => "ds_object_modified"
        }
        add_tag => ["ad_object_modified", "ad_change"]
      }
      
      # Critical attribute detection
      ruby {
        code => '
          attr = event.get("[winlog][event_data][AttributeLDAPDisplayName]") || ""
          
          critical_attrs = {
            "servicePrincipalName" => 80,
            "msDS-AllowedToDelegateTo" => 90,
            "userAccountControl" => 70,
            "primaryGroupID" => 75,
            "sidHistory" => 95,
            "msDS-KeyCredentialLink" => 85,
            "scriptPath" => 65
          }
          
          risk = 35
          
          if critical_attrs.key?(attr)
            risk = critical_attrs[attr]
            tags = event.get("tags") || []
            tags << "critical_attribute_modified" << "high_risk"
            event.set("tags", tags)
            event.set("[event][critical_attribute]", attr)
          end
          
          event.set("[event][risk_score]", risk.to_s)
        '
      }
    }
    
    # 5137: Directory Service Object Created
    if [event][code] == "5137" {
      mutate {
        add_field => {
          "[event][category]" => "directory_service_changes"
          "[event][subcategory]" => "object_creation"
          "[event][action]" => "ds_object_created"
          "[event][risk_score]" => "45"
        }
        add_tag => ["ad_object_created", "ad_change"]
      }
    }

    # 5139: Directory Service Object Moved
    if [event][code] == "5139" {
      mutate {
        add_field => {
          "[event][category]" => "directory_service_changes"
          "[event][subcategory]" => "object_moved"
          "[event][action]" => "ds_object_moved"
          "[event][risk_score]" => "50"
        }
        add_tag => ["ad_object_moved", "ad_change"]
      }
    }
    
    # 5141: Directory Service Object Deleted
    if [event][code] == "5141" {
      mutate {
        add_field => {
          "[event][category]" => "directory_service_changes"
          "[event][subcategory]" => "object_deletion"
          "[event][action]" => "ds_object_deleted"
          "[event][risk_score]" => "75"
        }
        add_tag => ["ad_object_deleted", "ad_change", "high_risk"]
      }
    }
    
    ##########################################################################
    # POLICY CHANGES
    ##########################################################################
    
    # 4719: System Audit Policy Changed
    if [event][code] == "4719" {
      mutate {
        add_field => {
          "[event][category]" => "policy_change"
          "[event][subcategory]" => "audit_policy"
          "[event][action]" => "audit_policy_changed"
          "[event][risk_score]" => "90"
        }
        add_tag => ["audit_policy_change", "policy_change", "high_risk", "defense_evasion"]
      }
    }
    
    # 4739: Domain Policy Changed
    if [event][code] == "4739" {
      mutate {
        add_field => {
          "[event][category]" => "policy_change"
          "[event][subcategory]" => "domain_policy"
          "[event][action]" => "domain_policy_changed"
          "[event][risk_score]" => "85"
        }
        add_tag => ["domain_policy_change", "policy_change", "high_risk"]
      }
    }
    
    ##########################################################################
    # KERBEROS EVENTS
    ##########################################################################
    
    # 4768: Kerberos TGT Request
    if [event][code] == "4768" {
      mutate {
        add_field => {
          "[event][category]" => "kerberos"
          "[event][subcategory]" => "tgt_request"
          "[event][action]" => "kerberos_authentication_ticket_requested"
        }
        add_tag => ["kerberos", "tgt_request"]
      }
      
      # Kerberoasting detection (RC4)
      if [winlog][event_data][TicketEncryptionType] == "0x17" {
        mutate {
          update => { "[event][risk_score]" => "75" }
          add_tag => ["potential_kerberoasting", "rc4_encryption", "high_risk"]
        }
      } else {
        mutate {
          add_field => { "[event][risk_score]" => "15" }
        }
      }
    }
    
    # 4769: Kerberos Service Ticket Request
    if [event][code] == "4769" {
      mutate {
        add_field => {
          "[event][category]" => "kerberos"
          "[event][subcategory]" => "service_ticket_request"
          "[event][action]" => "kerberos_service_ticket_requested"
          "[event][risk_score]" => "15"
        }
        add_tag => ["kerberos", "service_ticket"]
      }
      
      # RC4 service ticket (kerberoasting)
      if [winlog][event_data][TicketEncryptionType] == "0x17" {
        mutate {
          update => { "[event][risk_score]" => "70" }
          add_tag => ["kerberoasting", "rc4_service_ticket", "high_risk"]
        }
      }
    }
    
    # 4771: Kerberos Pre-authentication Failed
    if [event][code] == "4771" {
      mutate {
        add_field => {
          "[event][category]" => "kerberos"
          "[event][subcategory]" => "preauth_failure"
          "[event][action]" => "kerberos_preauth_failed"
          "[event][risk_score]" => "50"
        }
        add_tag => ["kerberos", "preauth_failed", "potential_attack"]
      }
    }
    
    ##########################################################################
    # SCHEDULED TASK EVENTS
    ##########################################################################
    
    # 4698: Scheduled Task Created
    if [event][code] == "4698" {
      mutate {
        add_field => {
          "[event][category]" => "scheduled_task"
          "[event][subcategory]" => "task_creation"
          "[event][action]" => "scheduled_task_created"
          "[event][risk_score]" => "60"
        }
        add_tag => ["scheduled_task_created", "persistence", "medium_risk"]
      }
    }
    
    # 4699: Scheduled Task Deleted
    if [event][code] == "4699" {
      mutate {
        add_field => {
          "[event][category]" => "scheduled_task"
          "[event][subcategory]" => "task_deletion"
          "[event][action]" => "scheduled_task_deleted"
          "[event][risk_score]" => "50"
        }
        add_tag => ["scheduled_task_deleted", "persistence_removed"]
      }
    }

    ##########################################################################
    # PROCESS CREATION (NEW PROCESS DETECTION)
    ##########################################################################
    
    # 4688: New Process Created
    if [event][code] == "4688" {
      mutate {
        add_field => {
          "[event][category]" => "process_creation"
          "[event][subcategory]" => "execution"
          "[event][action]" => "new_process_created"
        }
        add_tag => ["process_creation", "execution"]
      }

      ruby {
        code => '
          cmdline = event.get("[winlog][event_data][CommandLine]") || ""
          image = event.get("[winlog][event_data][NewProcessName]") || ""
          risk = 15
          tags = event.get("tags") || []

          suspicious_keywords = ["powershell", "cmd.exe", "wmic", "mshta", "rundll32", "regsvr32", "certutil", "bitsadmin"]
          encoded_patterns = [/Base64/i, /-enc/i, /-EncodedCommand/i]

          if suspicious_keywords.any? { |kw| image.downcase.include?(kw) }
            risk = 60
            tags << "suspicious_process"
          end

          if encoded_patterns.any? { |re| cmdline =~ re }
            risk = 75
            tags << "encoded_payload" << "potential_attack"
          end

          event.set("[event][risk_score]", risk.to_s)
          event.set("tags", tags.uniq)
        '
      }
    }

    ##########################################################################
    # FIREWALL / NETWORK EVENTS
    ##########################################################################
    
    # 5156: Windows Filtering Platform allowed connection
    if [event][code] == "5156" {
      mutate {
        add_field => {
          "[event][category]" => "network"
          "[event][subcategory]" => "connection_allowed"
          "[event][action]" => "connection_allowed"
          "[event][risk_score]" => "10"
        }
        add_tag => ["network_connection", "allowed_connection"]
      }
    }
    
    # 5158: Windows Filtering Platform blocked connection
    if [event][code] == "5158" {
      mutate {
        add_field => {
          "[event][category]" => "network"
          "[event][subcategory]" => "connection_blocked"
          "[event][action]" => "connection_blocked"
          "[event][risk_score]" => "20"
        }
        add_tag => ["network_connection", "blocked_connection", "defense_evasion"]
      }
    }

    # 4946: Windows Firewall Exception List - Rule Added
    if [event][code] == "4946" {
      mutate {
        add_field => {
          "[event][category]" => "firewall"
          "[event][subcategory]" => "firewall_rule_added"
          "[event][action]" => "firewall_exception_added"
          "[event][risk_score]" => "70"
        }
        add_tag => ["firewall_rule_added", "defense_evasion", "high_risk"]
      }
    }

    # 4947: Windows Firewall Exception List - Rule Modified
    if [event][code] == "4947" {
      mutate {
        add_field => {
          "[event][category]" => "firewall"
          "[event][subcategory]" => "firewall_rule_modified"
          "[event][action]" => "firewall_exception_modified"
          "[event][risk_score]" => "65"
        }
        add_tag => ["firewall_rule_modified", "defense_evasion", "medium_risk"]
      }
    }

    # 4950: Windows Firewall Setting Changed
    if [event][code] == "4950" {
      mutate {
        add_field => {
          "[event][category]" => "firewall"
          "[event][subcategory]" => "firewall_setting_changed"
          "[event][action]" => "firewall_settings_changed"
          "[event][risk_score]" => "75"
        }
        add_tag => ["firewall_config_changed", "defense_evasion", "high_risk"]
      }
    }

    ##########################################################################
    # SERVICE CREATION / DELETION
    ##########################################################################
    
    # 4697: Service Installed
    if [event][code] == "4697" {
      mutate {
        add_field => {
          "[event][category]" => "service_management"
          "[event][subcategory]" => "service_creation"
          "[event][action]" => "service_installed"
          "[event][risk_score]" => "70"
        }
        add_tag => ["service_created", "persistence", "high_risk"]
      }
    }

    # 7045: A new service was installed (System log olabilir ama security de düşebilir)
    if [event][code] == "7045" {
      mutate {
        add_field => {
          "[event][category]" => "service_management"
          "[event][subcategory]" => "service_install"
          "[event][action]" => "new_service_installed"
          "[event][risk_score]" => "70"
        }
        add_tag => ["new_service_installed", "persistence", "medium_risk"]
      }
    }

    ##########################################################################
    # SYSTEM / AUDIT / LOG CLEARED
    ##########################################################################
    
    # 1102: Audit Log Cleared
    if [event][code] == "1102" {
      mutate {
        add_field => {
          "[event][category]" => "audit_log"
          "[event][subcategory]" => "log_cleared"
          "[event][action]" => "security_log_cleared"
          "[event][risk_score]" => "95"
        }
        add_tag => ["log_cleared", "defense_evasion", "high_risk"]
      }
    }

    ##########################################################################
    # AUTHENTICATION EVENTS
    ##########################################################################
    
    # 4624: Successful Logon
    if [event][code] == "4624" {
      
      mutate {
        add_field => {
          "[event][category]" => "authentication"
          "[event][subcategory]" => "logon_success"
          "[event][action]" => "successful_logon"
        }
        add_tag => ["security-routine", "logon_success", "authentication"]
      }
      
      # Logon Type Parsing & Risk Assessment
      ruby {
        code => '
          logon_type = event.get("[winlog][event_data][LogonType]")
          target_user = (event.get("[winlog][event_data][TargetUserName]") || "").downcase
          
          logon_types = {
            "2" => "Interactive",
            "3" => "Network", 
            "4" => "Batch",
            "5" => "Service",
            "7" => "Unlock",
            "8" => "NetworkCleartext",
            "9" => "NewCredentials",
            "10" => "RemoteInteractive",
            "11" => "CachedInteractive"
          }
          
          if logon_type
            desc = logon_types[logon_type] || "Unknown"
            event.set("[event][logon_type]", logon_type)
            event.set("[event][logon_type_desc]", desc)
            
            risk = 10
            tags = event.get("tags") || []
            
            # Service account interactive logon (suspicious!)
            if logon_type == "2" && (target_user =~ /^svc|^service|^sql/)
              risk = 85
              tags << "service_account_interactive" << "suspicious" << "high_risk"
            end
            
            # Admin RDP logon
            if logon_type == "10" && (target_user =~ /^admin|^adm/)
              risk = 60
              tags << "admin_rdp_logon" << "privileged_access"
            end
            
            # Cleartext authentication
            if logon_type == "8"
              risk = 50
              tags << "cleartext_authentication" << "insecure_auth"
            end
            
            # After-hours detection (00:00 - 06:00)
            hour = Time.now.hour
            if hour >= 0 && hour < 6
              risk += 20
              tags << "after_hours_logon"
            end
            
            event.set("[event][risk_score]", risk.to_s)
            event.set("tags", tags) unless tags.empty?
          end
        '
      }
    }

    ##########################################################################
    # NTLM CREDENTIAL
    ##########################################################################

    # 4776: Domain Controller Credential Validation (NTLM)
    if [event][code] == "4776" {
      mutate {
        add_field => {
          "[event][category]" => "authentication"
          "[event][subcategory]" => "credential_validation"
          "[event][action]" => "credential_validation_attempt"
        }
        add_tag => ["security-routine", "credential_validation", "ntlm_auth"]
      }
  
      # Check for failure
      if [winlog][event_data][Status] == "0xC0000064" or 
        [winlog][event_data][Status] == "0xC000006A" {
        mutate {
          add_field => { "[event][risk_score]" => "55" }
          add_tag => ["failed_credential_validation", "potential_attack"]
        }
      } else {
        mutate {
          add_field => { "[event][risk_score]" => "20" }
        }
      }
    }

    ##########################################################################
    # ACTIVE DIRECTORY CHANGES
    ##########################################################################
    
    # 4662: Object Access (LAPS, etc.)
    if [event][code] == "4662" {
      mutate {
        add_field => {
          "[event][category]" => "object_access"
          "[event][subcategory]" => "ad_object_access"
          "[event][action]" => "directory_service_access"
        }
        add_tag => ["security-routine", "object_access", "ad_access"]
      }
      
      # LAPS password read detection
      if [winlog][event_data][Properties] =~ /ms-Mcs-AdmPwd|ms-MCS-AdmPwd/ {
        mutate {
          update => { "[event][risk_score]" => "90" }
          add_tag => ["laps_password_read", "credential_access", "high_risk"]
        }
      } else {
        mutate {
          add_field => { "[event][risk_score]" => "25" }
        }
      }
    }

    ##########################################################################
    # RISK NORMALIZATION & FINAL CLEANUP
    ##########################################################################
    mutate {
      convert => { "[event][risk_score]" => "integer" }
      remove_field => [ "[debug]" ]
    }

    if [event][risk_score] >= 70 {
      mutate { add_tag => ["critical_event"] }
    } else if [event][risk_score] >= 40 {
      mutate { add_tag => ["medium_event"] }
    } else {
      mutate { add_tag => ["low_event"] }
    }

  } # end if [winlog][channel] == "Security"

}
