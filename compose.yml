version: "3.8"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.15
    restart: always
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
      - ELASTIC_PASSWORD=XXXXX
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - /mnt/elasticsearch-data:/usr/share/elasticsearch/data
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.15
    restart: always
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=XXXXXXX
    depends_on:
      - elasticsearch
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.15
    restart: always
    container_name: logstash
    ports:
      - "5044:5044"
    volumes:
      - /mnt/logstash/conf.d:/usr/share/logstash/pipeline
    depends_on:
      - elasticsearch
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=XXXXX
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
